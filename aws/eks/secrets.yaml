apiVersion: v1
kind: Secret
metadata:
  name: landgo-secrets
  namespace: landgo
type: Opaque
stringData:
  DB_HOST: "landgo-db.xxxxxx.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "landgo"
  DB_USERNAME: "postgres"
  DB_PASSWORD: "your-secure-password"
  JWT_SECRET: "your-256-bit-secret-key-here-make-it-long-enough-for-hs256"
  GOOGLE_CLIENT_ID: "your-google-client-id"
  APPLE_CLIENT_ID: "your-apple-client-id"
---
# Note: In production, use AWS Secrets Manager with External Secrets Operator
# or sealed-secrets for better security
# 
# Example with External Secrets:
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: landgo-secrets
#   namespace: landgo
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets-manager
#     kind: ClusterSecretStore
#   target:
#     name: landgo-secrets
#     creationPolicy: Owner
#   data:
#     - secretKey: DB_PASSWORD
#       remoteRef:
#         key: landgo/db
#         property: password
